<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Install</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="/login.html" as="document">
<style>
  *{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
  }
  body{
    height: 100vh;
    display: flex;
    align-items: center;
    flex-direction: column;
    background:
      radial-gradient(1200px 600px at 10% -10%, oklch(90% .06 275 / .55), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, oklch(90% .06 200 / .45), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, oklch(90% .05 320 / .35), transparent 60%),
      #f6f7fb;
  }
  h1{
    font-size: 3rem;
    letter-spacing: -1px;
    text-align: center;
  }
  h2{
    margin: .5rem;
  }
  button{
    background-color: #1A73E8;
    color: #fff;
    cursor: pointer;
    font-size: 2rem;
    border-radius: 3rem;
    border: none;
    padding: .5rem 2rem .6rem 2rem;
    margin-top: 3rem;
  }
  button:hover{
    background-color: #185abc;
  }
</style>
</head>
<body>

<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150"><style>.a{fill:#373435;stroke:#373435;stroke-miterlimit:10}.b{fill:#fff;stroke:#373435;stroke-miterlimit:10}.c{fill:#fac62c}</style><path fill-rule="evenodd" class="a" d="m74.5 112.5c-21 0-38-17-38-38 0-21 17-38 38-38 21 0 38 17 38 38 0 21-17 38-38 38z"/><path fill-rule="evenodd" class="b" d="m75 104c-16 0-29-13-29-29 0-16 13-29 29-29 16 0 29 13 29 29 0 16-13 29-29 29z"/><path fill-rule="evenodd" class="a" d="m113 37v75h-9v-75z"/><path fill-rule="evenodd" class="c" d="m46.6 69.9c59.3-52.2 118.4 26.7 74 71.6 0 0 25.8-40.1-3.7-70.5-27.9-28.8-70.3-1.1-70.3-1.1z"/><path fill-rule="evenodd" class="c" d="m103.1 79.3c-59.3 52.2-118.4-26.7-74-71.6 0 0-25.8 40.1 3.6 70.5 28 28.8 70.4 1.1 70.4 1.1z"/></svg>  
  <h1>All your needs<br> on Arcos</h1>
  <h2>Download the Arcos app now</h2>
  <button id="installBtn">Install</button>
<script>
let deferredPrompt;

// Redirect if running as an installed PWA
function checkPWA() {
  const isPWA =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true; // iOS Safari

  if (isPWA) {
    location.replace('/login.html');
  }
}

// Initial check
checkPWA();

// Listen for display mode changes
window.matchMedia('(display-mode: standalone')
  .addEventListener('change', checkPWA);

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}

// Capture the install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

// Install button
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

// Hide button after installation
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  checkPWA();
});
</script>
</body>
</html>
