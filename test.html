<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Install</title>
  <link rel="manifest" href="manifest.json">
<style>
  *{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
  }
  body{
    height: 100vh;
    display: flex;
    align-items: center;
    flex-direction: column;
    background:
      radial-gradient(1200px 600px at 10% -10%, oklch(90% .06 275 / .55), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, oklch(90% .06 200 / .45), transparent 60%),
      radial-gradient(700px 500px at 50% 110%, oklch(90% .05 320 / .35), transparent 60%),
      #f6f7fb;
  }
  h1{
    font-size: 3rem;
    letter-spacing: -1px;
    text-align: center;
  }
  h3{
    margin: 2rem;
  }
  button{
    background-color: #1A73E8;
    color: #fff;
    cursor: pointer;
    font-size: 2rem;
    border-radius: 3rem;
    border: none;
    padding: .5rem 2rem .6rem 2rem;
    margin-top: 3rem;
  }
  button:hover{
    background-color: #185abc;
  }
</style>
</head>
<body>
  
<svg version="1.2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="150" height="150"><style>.a{fill:#efc747}.b{fill:#fff}.c{stroke:#000;stroke-miterlimit:10}.d{fill:#fff;stroke:#000;stroke-miterlimit:10}</style><path fill-rule="evenodd" class="a" d="m83.8 155.5c-28.1 0-50.8-22.7-50.8-50.7 0-28.1 22.7-50.8 50.8-50.8 28 0 50.7 22.7 50.7 50.8 0 28-22.7 50.7-50.7 50.7z"/><path fill-rule="evenodd" class="b" d="m79.8 158.5c-28.1 0-50.8-22.7-50.8-50.7 0-28.1 22.7-50.8 50.8-50.8 28 0 50.7 22.7 50.7 50.8 0 28-22.7 50.7-50.7 50.7z"/><path fill-rule="evenodd" class="a" d="m59.8-3c28 0 50.7 22.7 50.7 50.8 0 28-22.7 50.7-50.7 50.7-28.1 0-50.8-22.7-50.8-50.7 0-28.1 22.7-50.8 50.8-50.8z"/><path fill-rule="evenodd" class="b" d="m63.8-6c28 0 50.7 22.7 50.7 50.8 0 28-22.7 50.7-50.7 50.7-28.1 0-50.8-22.7-50.8-50.8 0-28 22.7-50.7 50.8-50.7z"/><path fill-rule="evenodd" class="c" d="m112 36v75h-10v-75z"/><path fill-rule="evenodd" class="c" d="m72.5 113c-21.3 0-38.5-17.2-38.5-38.5 0-21.3 17.2-38.5 38.5-38.5 21.3 0 38.5 17.2 38.5 38.5 0 21.3-17.2 38.5-38.5 38.5z"/><path fill-rule="evenodd" class="d" d="m73 104c-16 0-29-13-29-29 0-16 13-29 29-29 16 0 29 13 29 29 0 16-13 29-29 29z"/></svg>
  <h1>All your needs<br> on Arcos</h1>
  <h3>Check your Shift Details, Attendance Presents, Payroll and<br> team rosters in real time. Install Arcos directly to your home<br> screen or desktop for fast, offline-ready access.</h3>
  <h2>Download the Arcos app now</h2>
  <button id="installBtn">Install</button>
<script>
let deferredPrompt;

// Redirect if running as an installed PWA
function checkPWA() {
  const isPWA =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true; // iOS Safari

  if (isPWA) {
    location.replace('/login.html');
  }
}

// Initial check
checkPWA();

// Listen for display mode changes
window.matchMedia('(display-mode: standalone')
  .addEventListener('change', checkPWA);

// Register Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}

// Capture the install prompt
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});

// Install button
installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;

  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});

// Hide button after installation
window.addEventListener('appinstalled', () => {
  installBtn.style.display = 'none';
  checkPWA();
});
</script>
</body>
</html>
